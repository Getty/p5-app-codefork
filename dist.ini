name    = App-codefork
author  = Torsten Raudssus <getty@cpan.org>
license = Perl_5
copyright_holder = Torsten Raudssus <torsten@raudssus.de> L<https://raudssus.de/>
copyright_year   = 2026

[@Author::GETTY]

; Dockerfile, docker-release.sh and .dockerignore build the raudssus/codefork
; image after a release; README.md is the GitHub page. .claude/ (agent skills,
; rules, worker briefs) and .worktreeinclude (skilletor worktree marker) are
; for working ON this distribution, .github/ is the CI workflow -- all of them
; repo-only, of no use to anyone installing App::codefork. The bundle gathers
; dotfiles and ships a snapshot of the agent context in misc/agent-context/
; for build provenance anyway. (k6, k7.)
[PruneFiles]
filename = Dockerfile
filename = docker-release.sh
filename = .dockerignore
filename = README.md
match = ^\.claude/
match = ^\.worktreeinclude$
match = ^\.github/

[Run::AfterRelease]
run = ./docker-release.sh %v
